<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canonia</title>
<meta name="description" content="Juego de plataformas para crear tu influencer virtual con ayuda de la IA.">
<style>
  /* Mínimo para arrancar (T008). Los estilos del juego van en src/presentation/styles.css (T023). */
  :root { --bg: #0B0820; --ink: #F4F0FF; --muted: #A79BD6; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #game { position: fixed; inset: 0; }
  #stage { display: block; width: 100%; height: 100%; touch-action: none; }
  #screens { position: absolute; inset: 0; pointer-events: none; }
  #screens > * { pointer-events: auto; }
  noscript p { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="game">
  <canvas id="stage" aria-label="Nivel del juego"></canvas>
  <div id="screens" aria-live="polite"></div>
</div>
<noscript><p>Canonia necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
