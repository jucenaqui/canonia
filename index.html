<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canonia</title>
<meta name="description" content="Juego de plataformas para crear tu influencer virtual con ayuda de la IA.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&display=swap">
<link rel="stylesheet" href="src/presentation/styles.css">
</head>
<body>
<div id="game">
  <canvas id="stage" aria-label="Nivel del juego"></canvas>
  <div class="touch-controls" id="controls">
    <button type="button" id="btn-left" aria-label="Izquierda">◀</button>
    <button type="button" id="btn-right" aria-label="Derecha">▶</button>
    <span class="spacer"></span>
    <button type="button" id="btn-jump" class="jump" aria-label="Saltar">▲</button>
  </div>
  <button type="button" id="btn-pause" class="hud-pause" aria-label="Pausa" hidden>❚❚</button>
  <div id="screens" aria-live="polite"></div>
</div>
<noscript><p style="padding:16px">Canonia necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
