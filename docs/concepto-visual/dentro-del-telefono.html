<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canonia — Concepto visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0820; --ink:#F4F0FF; --muted:#A79BD6; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 700px at 50% -10%, #2A1670 0%, var(--bg) 60%); color:var(--ink);
         font-family:"Nunito", system-ui, sans-serif; min-height:100vh; }
  header { text-align:center; padding:36px 16px 8px; }
  header h1 { font-family:"Baloo 2", system-ui, sans-serif; font-weight:800; font-size:clamp(28px,5vw,44px); margin:0; letter-spacing:.5px; }
  header p { color:var(--muted); margin:6px 0 0; font-size:16px; }
  main { display:flex; flex-wrap:wrap; gap:40px; justify-content:center; padding:28px 16px 56px; }
  figure { margin:0; width:min(390px, 100%); }
  figcaption { text-align:center; color:var(--muted); margin-top:14px; font-size:15px; }
  figcaption b { color:var(--ink); display:block; font-size:17px; margin-bottom:2px; }
  .phone { border-radius:44px; padding:10px; background:linear-gradient(160deg,#3B2A86,#150E3A);
           box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12) inset, 0 0 60px rgba(124,77,255,.35); }
  .phone svg { display:block; width:100%; height:auto; border-radius:34px; }
  text { font-family:"Nunito", system-ui, sans-serif; font-weight:800; }
  .logo { font-family:"Baloo 2", system-ui, sans-serif; font-weight:800; }
  @keyframes bob   { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
  @keyframes float { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }
  @keyframes pulse { 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  @keyframes spin  { to { transform:rotate(360deg) } }
  @keyframes drift { 0%{ transform:translateY(0) } 100%{ transform:translateY(-40px) } }
  .bob   { animation:bob 2.2s ease-in-out infinite; }
  .float { animation:float 3s ease-in-out infinite; }
  .f2 { animation-delay:.6s } .f3 { animation-delay:1.2s } .f4 { animation-delay:1.8s }
  .pulse { animation:pulse 2s ease-in-out infinite; }
  .spin  { animation:spin 14s linear infinite; transform-box:fill-box; transform-origin:center; }
  .drift { animation:drift 9s linear infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .bob,.float,.pulse,.spin,.drift { animation:none } }
</style>
</head>
<body>
<header>
  <h1>Canonia</h1>
  <p>Concepto visual · tema "Dentro del teléfono"</p>
</header>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150B45"/><stop offset=".45" stop-color="#4B1FB8"/><stop offset=".8" stop-color="#E0428F"/><stop offset="1" stop-color="#FF9A62"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0835"/><stop offset=".55" stop-color="#3A1AA0"/><stop offset="1" stop-color="#B8349A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#FFB02E"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFFE0"/><stop offset="1" stop-color="#22C9F0"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7AB8"/><stop offset="1" stop-color="#FF3D77"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFFE0"/><stop offset=".5" stop-color="#8A6BFF"/><stop offset="1" stop-color="#FF7AB8"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E2FF"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="troll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#C81E4A"/></linearGradient>
    <linearGradient id="imgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6BFF"/><stop offset="1" stop-color="#FF7AB8"/></linearGradient>
    <linearGradient id="imgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C9F0"/><stop offset="1" stop-color="#7CFFE0"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1680"/><stop offset="1" stop-color="#120A3D"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloPink"><stop offset="0" stop-color="#FF7AB8" stop-opacity=".8"/><stop offset="1" stop-color="#FF7AB8" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloMint"><stop offset="0" stop-color="#7CFFE0" stop-opacity=".75"/><stop offset="1" stop-color="#7CFFE0" stop-opacity="0"/></radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <path id="heart" d="M0 9 C-16 -3 -8 -15 0 -7 C8 -15 16 -3 0 9Z"/>
    <path id="star" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/>

    <g id="post">

      <circle cx="22" cy="20" r="10" fill="url(#imgA)"/>

      <rect x="38" y="24" width="38" height="5" rx="2.5" fill="#D8CEFA"/>

    </g>
    <g id="hero-char">

      <path d="M12 10 L30 16 L26 22 L12 18Z" fill="#7CFFE0"/>
      <circle cx="-7" cy="-2" r="6.5" fill="#FFFFFF"/><circle cx="8" cy="-2" r="6.5" fill="#FFFFFF"/>
      <circle cx="-5.5" cy="-1" r="3.2" fill="#1B1147"/><circle cx="9.5" cy="-1" r="3.2" fill="#1B1147"/>
      <circle cx="-4.5" cy="-2.2" r="1.1" fill="#FFFFFF"/><circle cx="10.5" cy="-2.2" r="1.1" fill="#FFFFFF"/>

    </g>
    <g id="ghost">

  </defs>
</svg>
