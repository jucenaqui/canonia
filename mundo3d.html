<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canonia · PIX Central</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&display=swap">
<link rel="stylesheet" href="src/presentation/styles.css">
<style>
  /* Vista previa del mundo 3D (Fase 3). Se retira cuando el mundo 3D entre en index.html (T042). */
  #w3d { position: fixed; inset: 0; }
  #w3d canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .w3d-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter-right) 10px var(--gutter-left); background: rgba(255,255,255,.85); border-bottom: 1px solid var(--panel-line); }
  .w3d-top h1 { margin: 0; font: 700 1rem var(--font-display); }
  .w3d-top small { display: block; font: 500 .74rem var(--font-body); color: var(--muted); }
  .w3d-load { font: 500 .74rem var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .w3d-tip { position: absolute; left: var(--gutter-left); right: var(--gutter-right); top: calc(64px + env(safe-area-inset-top, 0px)); background: rgba(255,255,255,.9);
    border: 1px solid var(--panel-line); border-radius: 14px; padding: 10px 12px; font: 400 .86rem/1.4 var(--font-body); box-shadow: var(--shadow); pointer-events: none; }
  .w3d-tip b { color: var(--accent); font-family: var(--font-display); }
</style>
</head>
<body>
<div id="w3d">
  <canvas id="stage3d" aria-label="PIX Central en 3D"></canvas>
  <div id="overlay3d">
    <div class="w3d-top"><h1>PIX Central<small>Vista previa del mundo 3D</small></h1><span class="w3d-load" id="load3d">Modelos 0/0</span></div>
    <p class="w3d-tip" id="tip3d"><b>PIX</b> · Muévete con la palanca, salta con el botón y desliza el dedo por la escena para girar la cámara. En esta vista previa todos los puentes están abiertos para que recorras PIX Central.</p>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
  import { createWorld3d } from './src/presentation/world3d/world.js';
  import { WORLD_1_LAYOUT } from './src/content/world-1/layout.js';
  const load = document.getElementById('load3d');
  const tip = document.getElementById('tip3d');
  const world = createWorld3d({
    canvas: document.getElementById('stage3d'),
    overlay: document.getElementById('overlay3d'),
    layout: WORLD_1_LAYOUT,
    onProgress: (done, total) => { load.textContent = `Modelos ${done}/${total}`; if (done === total && total > 0) setTimeout(() => { load.hidden = true; }, 1500); },
    onFail: () => { tip.innerHTML = '<b>PIX</b> · Te caíste, pero no pasa nada: vuelves al último sitio seguro y no pierdes nada.'; },
  });
  for (const bridge of WORLD_1_LAYOUT.bridges) world.openBridge(bridge.to, { animate: false });
  world.start();
  world.loadModels();
  setTimeout(() => { tip.hidden = true; }, 12000);
</script>
</body>
</html>
